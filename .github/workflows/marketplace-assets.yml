name: Marketplace assets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '_marketplace/sets.txt'
      - '_marketplace/box_urls.csv'
      - '_marketplace/build_assets.py'
      - '.github/workflows/marketplace-assets.yml'

permissions:
  contents: write

concurrency:
  group: marketplace-assets
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python _marketplace/build_assets.py
      - name: Commit results
        run: |
          git config user.name "klikbrik-bot"
          git config user.email "actions@users.noreply.github.com"
          git add mp _marketplace/specs.csv _marketplace/missing_images.txt _marketplace/box_urls.csv
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "Marketplace photos + set specs"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 10; done
          exit 1
